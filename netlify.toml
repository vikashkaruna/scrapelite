[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Allow the runtime endpoint-override file to pass Netlify secrets scanning. It
  # holds public n8n webhook URLs read by the browser at runtime (not real
  # secrets), but their values match scanned env vars. Vite copies
  # public/runtime-config.js into the publish dir, so both the source and built
  # paths are omitted.
  SECRETS_SCAN_OMIT_PATHS = "public/runtime-config.js,dist/runtime-config.js"

# React Router: serve index.html for all routes so direct /preview and
# /dashboard URLs work instead of returning a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
