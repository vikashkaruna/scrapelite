[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
# CRITICAL: never commit test files inside netlify/functions/. Netlify's
# bundler auto-deploys every top-level .js in this directory as a
# serverless function, and a test file like `reengagement.test.js`
# produces a function named `reengagement.test` — the `.` violates
# Netlify's function-name rule (`^[a-zA-Z0-9_-]+$`) and the build fails.
# Tests for Netlify Functions belong in netlify/__tests__/.

[build.environment]
# `netlify.toml` holds operator-facing env-var NAMES as substrings (e.g.
# "PROD_RAZORPAY_SECRET") that intentionally match the env-var name — Netlify's
# secret scanner flags any value that looks like a known key, including the
# placeholders that document what each context needs. The real values go in
# the Netlify UI ("Environment variables") per context, so the scanner
# should ignore this file. Same for the operator docs.
SECRETS_SCAN_OMIT_PATHS = "public/runtime-config.js,dist/runtime-config.js,netlify.toml,NETLIFY-ENVIRONMENTS.md"

# ── API routes (must come BEFORE the SPA catch-all) ──────────────────────────
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# ── SPA fallback ──────────────────────────────────────────────────────────────
# React Router: serve index.html for all routes so direct /preview and
# /dashboard URLs work instead of returning a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
