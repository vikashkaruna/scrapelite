[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
# CRITICAL: never commit test files inside netlify/functions/. Netlify's
# bundler auto-deploys every top-level .js in this directory as a
# serverless function, and a test file like `reengagement.test.js`
# produces a function named `reengagement.test` — the `.` violates
# Netlify's function-name rule (`^[a-zA-Z0-9_-]+$`) and the build fails.
# Tests for Netlify Functions belong in netlify/__tests__/.

# ── Scheduled functions (cron) ────────────────────────────────────────────────
# THESE DECLARATIONS ARE LOAD-BEARING. Every cron below also carries an
# `export const config = { schedule: ... }` in its source, and that export is
# IGNORED here: it is only honoured for v2 functions (`export default`), while
# all of ours are v1 (`export const handler`) and `@netlify/functions` is not a
# dependency, so the `schedule()` wrapper is not in use either.
#
# Verified 2026-07-27 on the staging deploy, before these blocks existed:
#   * Netlify's own API reported `schedule: null` for every function;
#   * GET /.netlify/functions/reengagement returned 200 and RAN the handler
#     ("Re-engagement complete. 0 email(s) sent."), whereas a registered
#     scheduled function is not HTTP-invocable.
# i.e. none of these were on a cron at all — scheduled-runner had never run
# hourly since R19, and billing-lifecycle would never have run at all.
#
# Declaring the schedule here also makes Netlify BLOCK public HTTP access to
# these endpoints, which matters most for billing-purge: as a plain function it
# is a publicly reachable destructive endpoint.
#
# If you remove a block here, that function silently stops being a cron. There
# is no build error and no runtime error — it just never fires again.
[functions."scheduled-runner"]
  schedule = "@hourly"

[functions."reengagement"]
  schedule = "@daily"

[functions."billing-lifecycle"]
  schedule = "@daily"

[functions."billing-purge"]
  schedule = "@daily"

# Samples every service/host/database probe and stores one health_samples row
# per component, which is what makes the uptime and latency figures on
# /admin/health real rather than "up right now". Also emails on a critical
# state CHANGE — disarmed unless OPS_ALERT_EMAIL is set.
[functions."health-monitor"]
  schedule = "@hourly"

# Re-audits every page a user is watching and alerts on material score movement.
# THIS BLOCK is what schedules it — `export const config = { schedule }` inside
# the function is a v2 feature and is silently ignored for our v1 handlers.
# Deleting this block un-schedules the job with no build error and no runtime
# error; it simply never fires again.
[functions."discoverability-monitor"]
  schedule = "@daily"

# PRD 4's engine. Crawls monitored competitor pages, diffs structured snapshots
# and routes material changes. Hourly, because a watchlist may choose an hourly
# cadence; the job honours each watchlist's own cadence internally rather than
# needing one cron per cadence.
[functions."watchlist-monitor"]
  schedule = "@hourly"

# PRD 3's durability. Advances queued bulk-enrichment jobs so a list finishes
# whether or not the tab that started it is still open. Every 5 minutes: work is
# claimed per item, so this is safe alongside the client-driven chunk endpoint.
[functions."bulk-runner"]
  schedule = "*/5 * * * *"

# PRD 5's "retry failed actions". Re-attempts dispatches whose backoff has
# elapsed. Every 5 minutes, matching the first step of the backoff schedule
# (1m, 5m, 30m, 2h, 12h) closely enough that an early retry is not left waiting.
[functions."signal-retry"]
  schedule = "*/5 * * * *"

# The v2 workflow pipeline's dispatch loop: claims queued workflow_events and
# POSTs them to n8n. Every 5 minutes, matching the first step of the backoff
# schedule. Until 2026-09-06 this was scheduled NOWHERE — workflow-orchestrator
# declared `export const config = { schedule }` in its own source, which is a v2
# feature silently ignored for our v1 handlers — so it had never once fired.
#
# NOTE the "-cron" suffix, and do NOT "simplify" it onto workflow-orchestrator:
# scheduling a function makes Netlify refuse HTTP access to it, and
# workflow-orchestrator serves /ping and /dispatch to n8n plus /run-now to the
# operator. Both call the same runOnce(); only this one is on a clock.
[functions."workflow-orchestrator-cron"]
  schedule = "*/5 * * * *"

# Stage 3 SXO analytics ingestion. HTTP requests queue privacy-minimized
# aggregates; this worker claims them atomically and applies bounded retries.
[functions."sxo-analytics-import-worker"]
  schedule = "*/5 * * * *"

# W6.5 — the answer-engine sample. Deliberately NOT folded into
# discoverability-monitor: an engine outage must not pause page auditing.
[functions."prompt-monitor"]
  schedule = "@daily"

[build.environment]
  # The Netlify secret scanner does substring matching on values against
  # known env-var names. Operator-facing docs that LEGITIMATELY name env
  # vars (e.g. describing a past fix that mentioned "RAZORPAY_KEY_SECRET"
  # or pasting an example like `VITE_SUPABASE_ANON_KEY = "PROD_ANON_KEY"`)
  # would otherwise trigger false positives — so we omit them. The scanner
  # still watches all real source code.
  SECRETS_SCAN_OMIT_PATHS = "public/runtime-config.js,dist/runtime-config.js,netlify.toml,NETLIFY-ENVIRONMENTS.md,docs/SESSION-HANDOFF-2026-07-19-BUILD-FIXES.md,docs/SESSION-HANDOFF-2026-07-19.md"

  # `SECRETS_SCAN_OMIT_KEYS` is a comma-separated list of env-var NAMES
  # that the secret scanner should NOT touch. The Supabase anon key is
  # the public/publishable key (designed to ship in the browser bundle)
  # but the scanner's "smart detection" treats it as a JWT-shaped secret
  # and replaces the value with `****************<last4>`, which silently
  # breaks OAuth login in production. Same story for the n8n webhook URL,
  # which the scanner flags because it contains the word "webhook" with
  # what looks like a token-shaped path segment. Both values are NOT
  # secrets — the anon key is documented as publishable by Supabase, and
  # the webhook URL is a public n8n endpoint. If the scanner's heuristics
  # ever start flagging another public VITE_ value, add it here.
  # See docs/SESSION-HANDOFF-2026-07-29-OAUTH-CALLBACK-FIX.md.
  #
  # SUPABASE_ANON_KEY (no VITE_ prefix) was MISSING from this list until
  # 2026-08-13, and that is the other half of the same bug. The Netlify
  # Functions read `SUPABASE_ANON_KEY || VITE_SUPABASE_ANON_KEY`, so a
  # redacted server-side copy won the fallback and every authenticated
  # request died with GoTrue's "Invalid API key" — surfaced to users as
  # "Invalid or expired session" on every integration connect. Same key,
  # same publishable status, same reason to omit it.
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_ANON_KEY,SUPABASE_ANON_KEY,VITE_WEBHOOK_URL"

# Baseline browser protections for every static response.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # CSP — allow Razorpay's checkout surface end-to-end.
    # - script-src:   + checkout.razorpay.com (direct SDK fallback when the
    #                   same-origin proxy at /.netlify/functions/razorpay-sdk
    #                   is unavailable) and cdn.razorpay.com (the risk-
    #                   detection bundle the SDK fetches after it loads —
    #                   proxying it would break the SDK's own signed URLs).
    # - frame-src:    + api.razorpay.com + checkout.razorpay.com — the
    #                   Razorpay payment UI lives in an iframe posted by the
    #                   SDK to api.razorpay.com/v1/checkout/public. Without
    #                   an explicit frame-src it falls back to default-src
    #                   'self' and the modal is silently blocked, which is
    #                   the symptom in the user's bug report.
    # - style-src:    + checkout.razorpay.com — Razorpay's checkout iframe
    #                   injects a stylesheet from its own origin.
    # - form-action:  already permits checkout.razorpay.com (left untouched).
    # - connect-src:  already wildcards https: (covers api.razorpay.com,
    #                   lumberjack.razorpay.com telemetry, etc.).
    #
    # Google Analytics 4 (public/analytics.js):
    # - script-src:   + www.googletagmanager.com — the gtag.js bundle. WITHOUT
    #                   THIS THE TAG IS SILENTLY BLOCKED by the browser and GA
    #                   records nothing, with only a console CSP violation to
    #                   show for it. The loader itself is same-origin ('self').
    # - connect-src:  already wildcards https:, which covers the
    #                   google-analytics.com / analytics.google.com measurement
    #                   beacons and region1.* endpoints.
    # - img-src:      already allows https:, covering the pixel fallback GA
    #                   uses when fetch/sendBeacon are unavailable.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; frame-src 'self' https://api.razorpay.com https://checkout.razorpay.com; form-action 'self' https://checkout.razorpay.com https://js.stripe.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://checkout.razorpay.com; font-src 'self' https://fonts.gstatic.com data:; script-src 'self' 'unsafe-inline' https://js.stripe.com https://checkout.razorpay.com https://cdn.razorpay.com https://www.googletagmanager.com; connect-src 'self' https: wss:;"

# ── API routes (must come BEFORE the SPA catch-all) ──────────────────────────
# Public REST API (v1) and the Discoverability module both route internally
# on a sub-path. The more specific /api/v1/* and /api/discoverability/* rules
# MUST come first so they win over the catch-all /api/* rule below, because
# Netlify takes the first matching redirect and the generic one would swallow
# every sub-path into a function named after the first segment.
#
# The splat is forwarded as a PATH SEGMENT (`/.netlify/functions/<fn>/:splat`),
# not a query param (`?splat=:splat`). The query-string form was tried first —
# both functions' own code comments still describe it, since each handler
# keeps it as a fallback for api-v1.js's in-process delegation to
# discoverability.js — but it is the exact form that was already found to
# silently drop `:splat` on an explicit-prefix wildcard rule in production
# (see the integrations redirects' comment below, and commit 87f5597): the
# `*` matched, but the substitution into the query string did not happen,
# leaving `event.queryStringParameters.splat = ""` and every request 404ing
# as "Unknown endpoint." Both handlers now resolve the sub-path from
# event.path when the query is empty, mirroring the integrations fix.
# ── Help-centre renumbering (Discoverability inserted as section 11) ────────
