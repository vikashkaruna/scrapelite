[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Defensive: never bundle test files, hidden metadata, or editor cruft
  # from the functions directory. Netlify auto-deploys every top-level .js
  # in netlify/functions/ as a serverless function, so a stray test file
  # with a `.` in its name — e.g. `reengagement.test.js` — produces a
  # function named `reengagement.test`, which Netlify rejects as an
  # invalid name and fails the build. Keep this list in sync with the
  # test layout in netlify/__tests__/.
  ignored_files = [
    "netlify/functions/**/*.test.js",
    "netlify/functions/**/*.spec.js",
    "netlify/functions/**/.*",
  ]

[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "public/runtime-config.js,dist/runtime-config.js"

# ── API routes (must come BEFORE the SPA catch-all) ──────────────────────────
# Map /api/* → /.netlify/functions/* so the browser can call /api/extract
# instead of /.netlify/functions/extract.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# ── SPA fallback ──────────────────────────────────────────────────────────────
# React Router: serve index.html for all routes so direct /preview and
# /dashboard URLs work instead of returning a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
