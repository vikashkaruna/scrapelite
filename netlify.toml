# Same shape, same reason: pql.js routes internally on the sub-path after
# /pql/ (events | score), so it needs a path-based forwarding rule ahead of the
# generic /api/* catch-all. Note this is PATH-based, not `?splat=:splat` — the
# query-param form silently failed in production for every integrations
# provider once already (fixed in 87f5597) and again for discoverability.
# resolve-company is a single endpoint (no sub-path routing), so the generic
# /api/* rule below would handle it — declared explicitly anyway so the route
# is greppable next to its siblings rather than implied.
[[redirects]]
  from = "/api/resolve-company"
  to = "/.netlify/functions/resolve-company"
  status = 200
  force = true

[[redirects]]
  from = "/api/pql/*"
  to = "/.netlify/functions/pql/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/*"
  to = "/.netlify/functions/api-v1/:splat"
  status = 200
  force = true

# Integrations (HubSpot, Zapier, Notion, Airtable, Slack) — the splat is
# forwarded as a PATH SEGMENT (not a query param) so the function can
# dispatch on the sub-path. The previous `?splat=:splat` query-string
# form worked in the wildcard router path but dropped the splat on
# the per-provider explicit rules in production deploys — the `*` was
# matching but `:splat` wasn't being substituted, leaving the function
# with `event.path = "/.netlify/functions/integrations-slack"` (no
# sub-path) and `event.queryStringParameters.splat = ""`. Each handler
# now has a path-based fallback (commit 87f5597) that resolves the
# sub-path from `event.path` when the query is empty.
[[redirects]]
  from = "/api/integrations/hubspot/*"
  to = "/.netlify/functions/integrations-hubspot/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/integrations/notion/*"
  to = "/.netlify/functions/integrations-notion/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/integrations/airtable/*"
  to = "/.netlify/functions/integrations-airtable/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/integrations/slack/*"
  to = "/.netlify/functions/integrations-slack/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/integrations/zapier/*"
  to = "/.netlify/functions/integrations-zapier/:splat"
  status = 200
  force = true

# Wildcard fallback (for any future provider that doesn't get an explicit
# rule above). Routed through the dispatch router — it also reads the
# sub-path from `event.path` (commit 49ae0e9).
[[redirects]]
  from = "/api/integrations/*"
  to = "/.netlify/functions/integrations-router/:splat"
  status = 200
  force = true

