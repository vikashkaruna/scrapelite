# ── Retired URLs (must come BEFORE the SPA catch-all) ────────────────────────
# Mirrored in scripts/site-routes.mjs REDIRECTS; page-ownership.test.mjs asserts
# the two lists match, so a URL cannot be retired in one place only.
#
# 301, not 302: these moves are permanent, and only a 301 transfers the ranking
# signal of the old URL to the new one.

# /vs/* normalised to directory form so all five comparisons share one shape.
# public/vs/firecrawl.html and public/vs/firecrawl/index.html were BYTE-IDENTICAL
# duplicates, both live, competing for the same query.
[[redirects]]
  from = "/vs/firecrawl.html"
  to = "/vs/firecrawl"
  status = 301
  force = true

[[redirects]]
  from = "/vs/apify.html"
  to = "/vs/apify"
  status = 301
  force = true

[[redirects]]
  from = "/vs/phantombuster.html"
  to = "/vs/phantombuster"
  status = 301
  force = true

# The comparison hub moved from a hand-maintained file to a React route, so it
# can no longer drift from the real pricing and plan matrix.
[[redirects]]
  from = "/vs/compare.html"
  to = "/vs/compare"
  status = 301
  force = true

# /what-is-datiq merged into the consolidated FAQ.
[[redirects]]
  from = "/what-is-datiq"
  to = "/faq"
  status = 301
  force = true

# docs/build-help.mjs derives help filenames from the section TITLE, so
# retitling guide section 14 from "FAQ & troubleshooting" to "Troubleshooting"
# (its FAQ entries moved to /faq) renamed the generated page. The section
# NUMBER is unchanged, so /help/15-* and /help/16-* are unaffected — only this
# one URL moved.
[[redirects]]
  from = "/help/14-faq-and-troubleshooting.html"
  to = "/help/21-troubleshooting.html"
  status = 301
  force = true

# These two were React <Navigate> elements in App.jsx pointing at
# /vs/browse-ai. That React route is gone (the page is static-owned now), so
# without these a client-side navigation would land on NotFound.
[[redirects]]
  from = "/compare"
  to = "/vs/browse-ai"
  status = 301
  force = true

[[redirects]]
  from = "/compare/*"
  to = "/vs/browse-ai"
  status = 301
  force = true

# ── Homepage: serve the PRERENDERED document ─────────────────────────────────
# Every other public route gets its prerendered HTML for free, because Vite
# copies public/<route>/index.html into dist/ and a real file beats the
# non-forced SPA fallback below. `/` cannot use that mechanism: its output file
# would be public/index.html, which would be copied over dist/index.html and
# destroy the app's entry point. So it renders to public/home/index.html and is
# rewritten here.
#
# ⚠️ `force = true` is REQUIRED, and it is the one rule above that needs it.
# dist/index.html is a real file at `/`, so without force it wins and the
# rewrite silently does nothing — the exact failure this is fixing.
#
# Why it matters: the shell's entire <body> is `<div id="root"></div>`. A
# discoverability audit of https://datiq.app on 2026-08-26 measured 10 rendered
# words, no H1 and no headings on the site's highest-priority URL, scoring
# AEO 25.4. Googlebot renders JavaScript eventually; GPTBot, ClaudeBot,
# PerplexityBot and CCBot largely do not.
#
# Humans are unaffected: this is the same artefact /pricing already serves —
# real HTML that boots React over itself.
[[redirects]]
  from = "/"
  to = "/home/index.html"
  status = 200
  force = true

# /home is an implementation detail, not a URL. It 301s for humans; the
# X-Robots-Tag below covers crawlers; and the generated file's own canonical is
# https://datiq.app/, so it cannot become a duplicate in the index either way.
# Netlify matches paths exactly, so this does NOT intercept /home/index.html.
[[redirects]]
  from = "/home"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/home/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# ── SPA fallback ──────────────────────────────────────────────────────────────
# React Router: serve index.html for all routes so direct /preview and
# /dashboard URLs work instead of returning a 404.
#
# No `force`, deliberately: real files in dist/ win over this rule, which is
# what lets the prerendered HTML and the static-owned pages be served to
# crawlers instead of an empty shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── SEO: hide /admin/* from every crawler ─────────────────────────────────────
# Belt-and-braces alongside robots.txt and the in-page <meta name="robots">
# tag (set by AdminLayout.jsx via src/lib/seoMeta.js). This header fires for
# any request to /admin or any /admin/* subpath, so a crawler that ignores
# robots.txt still gets told to drop the page from the index. The
# Cache-Control prevents an intermediate cache from serving a previously
# cached "index, follow" copy to a different crawler.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate, unavailable_after: 31 Dec 2099 23:59:59 GMT"
    Cache-Control = "no-store, no-cache, must-revalidate, private"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate, unavailable_after: 31 Dec 2099 23:59:59 GMT"
    Cache-Control = "no-store, no-cache, must-revalidate, private"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"

# ── SEO: the signed-in application must never be indexed ─────────────────────
# These routes are not content. Every one of them serves the SPA shell, which
# carries index.html's canonical pointing at the homepage — so Google was being
# told "/dashboard IS https://datiq.app/". That is the same defect that got
# /privacy, /terms and /vs/battlecard dropped from the index as duplicates.
#
# This header is the REAL defence because it needs no JavaScript. The inline
# guard in index.html covers the same prefix list for JS-executing crawlers,
# and robots.txt asks politely; the list is kept in scripts/site-routes.mjs as
# PRIVATE_PREFIXES and asserted against this file by page-ownership.test.mjs.
[[headers]]
  for = "/dashboard/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/dashboard"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/account/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/account"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/preview"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/batch"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/schedules"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/discoverability"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/discoverability/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/workspace"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
# Intelligence Workflows: a signed-in-only workspace holding the customer's
# own lists / watchlists / routing rules.
[[headers]]
  for = "/lists"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/lists/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/watchlists"
  [headers.values]
