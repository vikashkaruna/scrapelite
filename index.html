<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>DatIQ: The Unified Web Intelligence Platform | Intelligence from Web</title>
    <meta name="description" content="DatIQ is the unified web intelligence platform — extract, enrich and operationalize data from any public URL, batch, or scheduled run. Built on Pillar 0 (Web Intelligence Core). Free to start." />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <link rel="canonical" href="https://datiq.app/" />

    <!-- SEO: /admin/* is operator-only. The in-page AdminLayout rewrites
         the robots meta + OG tags to noindex on the client. The
         server-rendered shell below is a defense-in-depth fallback for
         crawlers that don't execute JS. -->
    <script>
      (function () {
        try {
          if (typeof window === "undefined" || !window.location) return;
          if (window.location.pathname.indexOf("/admin") === 0) {
            var setMeta = function (attr, key, content) {
              var sel = "meta[" + attr + '="' + key + '"]';
              var el = document.head.querySelector(sel);
              if (!el) {
                el = document.createElement("meta");
                el.setAttribute(attr, key);
                document.head.appendChild(el);
              }
              el.setAttribute("content", content);
            };
            setMeta("name", "robots", "noindex, nofollow, noarchive, nosnippet, noimageindex");
            setMeta("property", "og:title", "DatIQ");
            setMeta("property", "og:description", "Restricted area.");
            setMeta("property", "og:url", "");
            setMeta("name", "description", "Restricted area.");
            var link = document.head.querySelector('link[rel="canonical"]');
            if (link) link.remove();
            document.title = "DatIQ";
          }
        } catch (e) { /* no-op */ }
      })();
    </script>
    <meta name="theme-color" content="#6366f1" />
    <meta name="author" content="DatIQ" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DatIQ: The Unified Web Intelligence Platform" />
    <meta property="og:description" content="DatIQ — Intelligence from Web. The unified platform for single, batch, and scheduled URL extraction, enrichment, and operationalization. Built on Pillar 0: Web Intelligence (Core)." />
    <meta property="og:url" content="https://datiq.app/" />
    <meta property="og:site_name" content="DatIQ" />
    <meta property="og:image" content="https://datiq.app/favicon.svg" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DatIQ: The Unified Web Intelligence Platform" />
    <meta name="twitter:description" content="DatIQ — Intelligence from Web. Single, batch, and scheduled URL extraction, enrichment, and operationalization, built on Pillar 0: Web Intelligence (Core)." />
    <meta name="twitter:image" content="https://datiq.app/favicon.svg" />
    <meta name="twitter:site" content="@datiq_app" />

    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "DatIQ",
      "alternateName": "DatIQ — The Unified Web Intelligence Platform",
      "url": "https://datiq.app",
      "logo": "https://datiq.app/favicon.svg",
      "description": "DatIQ is the unified web intelligence platform. Its foundation is Pillar 0 — Web Intelligence (Core) — a proven single, batch, and scheduled URL-extraction engine that the rest of the platform is built upon. From any public URL, get headings, links, contacts, pricing, AI summaries, enrichment, scheduling, and exports.",
      "slogan": "Intelligence from Web",
      "sameAs": [
        "https://www.linkedin.com/company/datiq",
        "https://twitter.com/datiq_app",
        "https://github.com/vikashkaruna/scrapelite"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "email": "hello@datiq.app",
        "availableLanguage": "English"
      }
    }
    </script>

    <!-- JSON-LD: WebSite with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "DatIQ",
      "alternateName": "DatIQ — Intelligence from Web",
      "url": "https://datiq.app",
      "description": "DatIQ: The Unified Web Intelligence Platform — single, batch, and scheduled URL extraction, enrichment, and operationalization. Built on Pillar 0 (Web Intelligence Core).",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://datiq.app/?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- JSON-LD: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "DatIQ",
      "alternateName": "DatIQ — The Unified Web Intelligence Platform",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "url": "https://datiq.app",
      "description": "DatIQ is the unified web intelligence platform. Pillar 0 (Web Intelligence Core) is the proven single, batch, and scheduled URL-extraction engine that the whole platform is built on. From a single URL to an entire domain, DatIQ delivers structured intelligence — headings, links, contacts, pricing, AI summaries — in seconds, with no code required.",
      "featureList": [
        "Pillar 0: Web Intelligence (Core) — single, batch, and scheduled URL extraction",
        "Headings H1–H6, internal/external links, metadata",
        "AI summary: plain-language overview of any page",
        "Custom field extraction in plain English",
        "Contact extraction: emails, LinkedIn, leadership names",
        "Pricing extraction from any pricing page",
        "Domain mapping: discover all indexed URLs on a site",
        "CSV and PDF export",
        "Content generation: SEO briefs, email drafts"
      ],
      "offers": {
        "@type": "Offer",
        "name": "Free plan",
        "price": "0",
        "priceCurrency": "USD",
        "description": "10 extractions per month, no credit card required."
      }
    }
    </script>

    <!-- Runtime endpoint overrides (read at load, not baked in at build). Must
         run before the app module so config.js can read window.__DATIQ_RUNTIME__. -->
    <script src="/runtime-config.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Apply the saved theme synchronously before React renders, so the
         first paint uses the right colors. Without this, the page briefly
         paints in the default light theme and axe-core samples a mid-
         transition value that fails contrast checks. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("datiq.theme");
          if (t === "light" || t === "dark") {
            document.documentElement.setAttribute("data-theme", t);
          } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
            document.documentElement.setAttribute("data-theme", "dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
