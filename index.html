<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>DatIQ — Extract web data in seconds | Zero-code web extraction &amp; AI enrichment</title>
    <meta name="description" content="DatIQ turns any public URL into structured data — headings, links, contacts, pricing, and an AI summary — in seconds. No code, no setup, no scrapers. Free to start." />
    <meta name="keywords" content="web extraction, web scraping, no-code scraper, extract emails from website, find company contacts, competitor pricing tracker, website structure analyzer, AI enrichment, data extraction tool, web data, lead generation, DatIQ" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <link rel="canonical" href="https://scrapelite.netlify.app/" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="author" content="DatIQ" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DatIQ — Intelligence from Every URL" />
    <meta property="og:description" content="Turn any public URL into structured data — headings, links, contacts, pricing, and an AI summary — in seconds. No code required. Free to start." />
    <meta property="og:url" content="https://scrapelite.netlify.app/" />
    <meta property="og:site_name" content="DatIQ" />
    <meta property="og:image" content="https://scrapelite.netlify.app/favicon.svg" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DatIQ — Intelligence from Every URL" />
    <meta name="twitter:description" content="Turn any public URL into structured data — headings, links, contacts, pricing, and an AI summary — in seconds. No code required." />
    <meta name="twitter:image" content="https://scrapelite.netlify.app/favicon.svg" />
    <meta name="twitter:site" content="@datiq_app" />

    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "DatIQ",
      "url": "https://scrapelite.netlify.app",
      "logo": "https://scrapelite.netlify.app/favicon.svg",
      "description": "DatIQ is a zero-code web extraction and AI enrichment platform. Turn any public URL into structured data — headings, links, contacts, pricing, and an AI summary — in seconds.",
      "sameAs": [
        "https://www.linkedin.com/company/datiq",
        "https://twitter.com/datiq_app",
        "https://github.com/vikashkaruna/scrapelite"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "email": "support@datiq.app",
        "availableLanguage": "English"
      }
    }
    </script>

    <!-- JSON-LD: WebSite with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "DatIQ",
      "url": "https://scrapelite.netlify.app",
      "description": "Zero-code web extraction and AI enrichment platform.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://scrapelite.netlify.app/?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- JSON-LD: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "DatIQ",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "url": "https://scrapelite.netlify.app",
      "description": "DatIQ extracts structured data from any public website — headings, links, contacts, pricing tables, and AI summaries — with a single URL paste. No code or setup required.",
      "featureList": [
        "Web extraction: headings H1–H6, internal/external links, metadata",
        "AI summary: plain-language overview of any page",
        "Custom field extraction in plain English",
        "Contact extraction: emails, LinkedIn, leadership names",
        "Pricing extraction from any pricing page",
        "Domain mapping: discover all indexed URLs on a site",
        "CSV and PDF export",
        "Content generation: SEO briefs, email drafts"
      ],
      "offers": {
        "@type": "Offer",
        "name": "Free plan",
        "price": "0",
        "priceCurrency": "USD",
        "description": "10 extractions per month, no credit card required."
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "reviewCount": "124"
      }
    }
    </script>

    <!-- Runtime endpoint overrides (read at load, not baked in at build). Must
         run before the app module so config.js can read window.__DATIQ_RUNTIME__. -->
    <script src="/runtime-config.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
