<!DOCTYPE html>
<html lang="en" data-datiq-app="spa">
  <head>
    <meta charset="UTF-8" />
    <!-- ⚠️ Nothing may go between <!DOCTYPE> and <html>. Vite's dev server
         injects the @vitejs/plugin-react refresh preamble at exactly that
         position, so a comment there SWALLOWS the preamble and the dev server
         dies with "can't detect preamble". Production builds are unaffected,
         which is what makes it easy to ship. Keep commentary inside <head>.

         data-datiq-app on <html> above marks this document as the React shell.
         public/analytics.js reads it in <head>, BEFORE <body> exists, to decide
         whether gtag should send its own page_view (static page: yes) or leave
         that to usePageView.js after the router has set the title (SPA: no). A
         #root lookup cannot answer that question this early. Prerendered pages
         inherit the attribute and do boot React, so they correctly count as
         SPA; the hand-written static pages under public/ never carry it. -->

    <!-- Runtime endpoint overrides (read at load, not baked in at build). Must
         run before the app module so config.js can read window.__DATIQ_RUNTIME__.
         ⚠️ It must ALSO run before /analytics.js directly below: analytics.js
         distinguishes "gaMeasurementId absent" (fall back to its built-in id)
         from "gaMeasurementId empty" (deliberately disabled). If this file has
         not run yet, the key reads as absent and the PRODUCTION property fires
         on staging, branch deploys and previews. Keep these two in this order. -->
    <script src="/runtime-config.js"></script>

    <!-- Google tag (gtag.js), via the shared consent-aware loader. Synchronous
         so the Consent Mode v2 default lands on the dataLayer before gtag.js
         can run. See public/analytics.js. -->
    <script src="/analytics.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>DatIQ — Intelligence, Connected.</title>
    <meta name="description" content="DatIQ turns public web signals into structured intelligence and connected workflows. Extract, enrich, monitor and audit a URL with evidence you can use." />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <link rel="canonical" href="https://datiq.app/" />

    <!-- SEO: these prefixes are the signed-in application, not content. They
         must never be indexed, and — critically — must never keep the root
         canonical above, which would tell Google "/dashboard IS the homepage"
         and get the real page dropped as a duplicate. That is exactly the bug
         that left /privacy, /terms and /vs/battlecard out of the index.

         netlify.toml sends X-Robots-Tag for the same list, which is the real
         defence (it works for crawlers that don't execute JS). This block is
         the in-page belt-and-braces.

         ⚠️ Deliberately an explicit ALLOW-LIST of private prefixes, not
         "any path that isn't /". Public routes are prerendered with a correct
         per-page canonical baked in and re-set by useSeo on mount; a blanket
         rule would delete that canonical at head-parse time on every real
         page load, leaving a window where a JS-executing crawler sees none. -->
    <script data-datiq-private-guard>
      (function () {
        try {
          if (typeof window === "undefined" || !window.location) return;
          var PRIVATE = [
            "/admin", "/dashboard", "/account", "/preview", "/batch",
            "/schedules", "/discoverability", "/workspace", "/collections", "/payment",
            "/lists", "/watchlists", "/rules", "/workflows",
            "/reset-password", "/onboarding"
          ];
          var path = window.location.pathname || "";
          var isPrivate = PRIVATE.some(function (p) {
            return path === p || path.indexOf(p + "/") === 0 || path.indexOf(p) === 0;
          });
          if (isPrivate) {
            var setMeta = function (attr, key, content) {
              var sel = "meta[" + attr + '="' + key + '"]';
              var el = document.head.querySelector(sel);
              if (!el) {
                el = document.createElement("meta");
                el.setAttribute(attr, key);
                document.head.appendChild(el);
              }
              el.setAttribute("content", content);
            };
            setMeta("name", "robots", "noindex, nofollow, noarchive, nosnippet, noimageindex");
            setMeta("property", "og:title", "DatIQ");
            setMeta("property", "og:description", "Restricted area.");
            setMeta("property", "og:url", "");
            setMeta("name", "description", "Restricted area.");
            var link = document.head.querySelector('link[rel="canonical"]');
            if (link) link.remove();
            document.title = "DatIQ";
          }
        } catch (e) { /* no-op */ }
      })();
    </script>
    <meta name="theme-color" content="#6366f1" />
    <meta name="author" content="DatIQ" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DatIQ — Intelligence, Connected." />
    <meta property="og:description" content="Turn public web signals into structured intelligence and connected workflows. Extract, enrich, monitor and audit a URL with evidence you can use." />
    <meta property="og:url" content="https://datiq.app/" />
    <meta property="og:site_name" content="DatIQ" />
    <meta property="og:image" content="https://datiq.app/og-card.jpg" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DatIQ — Intelligence, Connected." />
    <meta name="twitter:description" content="Turn public web signals into structured intelligence and connected workflows. Extract, enrich, monitor and audit a URL with evidence you can use." />
    <meta name="twitter:image" content="https://datiq.app/og-card.jpg" />
    <meta name="twitter:site" content="@datiq_app" />

    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "DatIQ",
      "alternateName": "DatIQ — Intelligence, Connected.",
      "url": "https://datiq.app",
      "logo": "https://datiq.app/favicon.svg",
      "description": "DatIQ turns public web signals into structured intelligence and connected workflows through extraction, enrichment, discoverability audits, monitoring and exports.",
      "slogan": "Intelligence, Connected.",
      "sameAs": [
        "https://www.linkedin.com/company/datiq",
        "https://twitter.com/datiq_app"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "email": "hello@datiq.app",
        "availableLanguage": "English"
      }
    }
    </script>

    <!-- JSON-LD: WebSite with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "DatIQ",
      "alternateName": "DatIQ — Intelligence, Connected.",
      "url": "https://datiq.app",
      "description": "DatIQ turns public web signals into structured intelligence and connected workflows through extraction, enrichment, discoverability audits, monitoring and exports.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://datiq.app/?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- JSON-LD: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "DatIQ",
      "alternateName": "DatIQ — The Unified Web Intelligence Platform",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "url": "https://datiq.app",
      "description": "DatIQ is the unified web intelligence platform. Pillar 0 (Web Intelligence Core) is the proven single, batch, and scheduled URL-extraction engine that the whole platform is built on. From a single URL to an entire domain, DatIQ delivers structured intelligence — headings, links, contacts, pricing, AI summaries — in seconds, with no code required.",
      "featureList": [
        "Pillar 0: Web Intelligence (Core) — single, batch, and scheduled URL extraction",
        "Headings H1–H6, internal/external links, metadata",
        "AI summary: plain-language overview of any page",
        "Custom field extraction in plain English",
        "Contact extraction: emails, LinkedIn, leadership names",
        "Pricing extraction from any pricing page",
        "Domain mapping: discover all indexed URLs on a site",
        "CSV and PDF export",
        "Content generation: SEO briefs, email drafts"
      ],
      "offers": {
        "@type": "Offer",
        "name": "Free plan",
        "price": "0",
        "priceCurrency": "USD",
        "description": "10 extractions per month, no credit card required."
      }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Apply the saved theme synchronously before React renders, so the
         first paint uses the right colors. Without this, the page briefly
         paints in the default light theme and axe-core samples a mid-
         transition value that fails contrast checks. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("datiq.theme");
          if (t === "light" || t === "dark") {
            document.documentElement.setAttribute("data-theme", t);
          } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
            document.documentElement.setAttribute("data-theme", "dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
