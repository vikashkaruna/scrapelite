# GENERATED layout for the tracker/config layer: exactly the two deploy-coupled
# files, nothing else.
worker_processes auto;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server {
    listen 80;
    root /usr/share/nginx/html;

    location = /healthz { access_log off; return 200 "ok\n"; }
    location = /runtime-config.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /analytics.js      { add_header Cache-Control "max-age=300"; try_files $uri =404; }
    location / { return 404; }
  }
}
