# GENERATED layout for the admin surface: the SPA shell answers /admin* paths
# (the router inside reads location.pathname); everything else 404s here.
worker_processes auto;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server {
    listen 80;
    root /usr/share/nginx/html;

    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate, nocache, unavailable_after: 31 Dec 2099 23:59:59 GMT" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /healthz { access_log off; return 200 "ok\n"; }
    location = /admin { try_files /index.html =404; }
    location /admin/ { try_files $uri /index.html =404; }
    location / { return 404; }
  }
}
