# GENERATED layout mirrors netlify.toml edge semantics for the web surface.
worker_processes auto;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 10m;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # netlify.toml's one FORCED rewrite: / → /home/index.html (beats the SPA shell).
    location = / { try_files /home/index.html /index.html =404; }

    # /admin is a separate deployable — never served from the web payload.
    location = /admin { return 404; }
    location /admin/ { return 404; }

    # static file → prerendered page → SPA shell (netlify.toml precedence)
    location /assets/ { try_files $uri =404; }
    location / {
      try_files $uri $uri/index.html @spa;
    }
    location @spa { try_files /index.html =404; }
  }
}
