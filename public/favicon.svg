<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="22" fill="#4f46e5"/>
  <!-- 3 ascending data bars (Dat = data analytics) -->
  <rect x="16" y="62" width="15" height="23" rx="3.5" fill="rgba(255,255,255,.42)"/>
  <rect x="42.5" y="46" width="15" height="39" rx="3.5" fill="rgba(255,255,255,.68)"/>
  <rect x="69" y="27" width="15" height="58" rx="3.5" fill="#ffffff"/>
  <!-- IQ trend arc connecting bar tops — ascending intelligence line -->
  <polyline points="23.5,60 50,44 76.5,25" fill="none" stroke="rgba(255,255,255,.82)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- IQ node: glowing point at the top (intelligence apex) -->
  <circle cx="76.5" cy="25" r="6" fill="#ffffff"/>
  <circle cx="50" cy="44" r="3.8" fill="rgba(255,255,255,.72)"/>
  <circle cx="23.5" cy="60" r="3" fill="rgba(255,255,255,.55)"/>
</svg>
