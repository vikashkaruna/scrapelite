# .github/workflows/gcp-prod.yml — GCP production deploy (doc 05 §3b/§3c).
#
# HOW AND WHEN PROD DEPLOYS TRIGGER (the direction):
#   - NEVER on push. There is no push trigger here by design — production moves
#     only when a human clicks "Run workflow".
#   - Only after staging has gone green (gcp-staging.yml) AND the soak checklist
#     passed (doc 08 §3b): OAuth round-trips, extraction chain, payments
#     test-mode, Resend test email, n8n round-trip, admin, monitoring.
#   - Default mode is DIGEST PROMOTION from staging (promote-prod.sh, no
#     rebuild): what staging validated byte-for-byte is what prod gets.
#
# BEFORE FIRST USE (one-time, owner):
#   1. GitHub repo → Settings → Environments → create `gcp-prod`.
#      Secrets: GCP_SA_KEY (a SEPARATE prod deploy SA key) and ENV_FILE (the
#      whole contents of deployment/env/.env.prod). Variables:
#      STAGING_GCP_PROJECT_ID / STAGING_AR_REPO / STAGING_IMG_TAG for digest
#      promotion.
#   2. Enable "Required reviewers" on the `gcp-prod` environment — the approval
#      IS the prod gate (replaces phase-gate.yml's manual-approval job).
#   3. Fill deployment/env/.env.prod (operator side) so local prod operations
#      and CI agree on the contract.
#
# SAFETY RAILS BELOW:
#   - `confirm_env` input must be typed as "prod" (typo = no-op).
#   - concurrency group serializes prod runs; a run waits instead of racing.
#   - The prod DB is NEVER touched: SKIP_DB is not even an input — the Cloud SQL
#     cutover lives in cutover-db.sh (doc 09), run by a human in the window.
name: gcp-prod

on:
  workflow_dispatch:
    inputs:
      confirm_env:
        description: 'Type "prod" to confirm (must match exactly)'
        required: true
        default: ""
      promote_from_staging:
        description: "Promote staging digests (false = build fresh prod images)"
        type: boolean
        default: true

concurrency:
  group: gcp-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: gcp-prod
    steps:
      - name: Verify confirmation
        run: |
          if [ "${{ inputs.confirm_env }}" != "prod" ]; then
            echo "::error::confirm_env must be exactly 'prod' — refusing to deploy."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install CLIs
        run: npm i -g firebase-tools

      - name: Parameterisation gate (doc 06 §9)
        run: bash deployment/scripts/check-parameterisation.sh

      - name: Write the deploy env file from the ENV_FILE secret
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          mkdir -p deployment/env
          if [ -z "${ENV_FILE}" ]; then
            echo "::error::Environment secret ENV_FILE is empty — paste deployment/env/.env.prod into it."
            exit 1
          fi
          printf '%s\n' "${ENV_FILE}" > deployment/env/.env.prod
          if ! grep -qE '^DATIQ_ENV=prod[[:space:]]*$' deployment/env/.env.prod; then
            echo "::error::ENV_FILE does not declare DATIQ_ENV=prod — wrong file pasted?"
            exit 1
          fi
          # Optional overrides for the digest-promotion source (variables win
          # over the file, but ONLY when set — an unset variable must never
          # blank a value the file already carries).
          for pair in "STAGING_GCP_PROJECT_ID=${{ vars.STAGING_GCP_PROJECT_ID }}" \
                      "STAGING_AR_REPO=${{ vars.STAGING_AR_REPO }}" \
                      "STAGING_IMG_TAG=${{ vars.STAGING_IMG_TAG }}"; do
            [ -n "${pair#*=}" ] && echo "$pair" >> deployment/env/.env.prod
          done

      - name: Deploy prod shadow (digest promotion, OPS_JOBS_DISABLED honored from the contract)
        env:
          RUNTIME_ENV_FILE: deployment/env/.env.prod
        run: |
          chmod +x deployment/scripts/gcp/*.sh
          if [ "${{ inputs.promote_from_staging }}" = "true" ]; then
            ./deployment/scripts/gcp/up.sh prod
          else
            ./deployment/scripts/gcp/up.sh prod --build
          fi

      - name: Smoke the deployed URL
        run: ./deployment/scripts/gcp/smoke.sh prod
