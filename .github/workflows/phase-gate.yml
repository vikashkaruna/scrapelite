# .github/workflows/phase-gate.yml
#
# Phase-Gate Production Deploy
# ─────────────────────────────
# Runs on every push to main. Production is GCP (Cloud Run + Firebase Hosting);
# Netlify is no longer a deploy target and nothing here touches it.
#
#   1. Production Gate: Test Suites         → functional, regression, security,
#                                             integration and e2e suites green
#   2. Production Gate: Vulnerabilities     → no high/critical advisories unless
#                                             bypassed with a TODO + expiry
#   3. Production Gate: Open Issues/Defects → no open defects unless labeled
#                                             gate-bypass with a TODO
#   4. Staging Released & Tested            → a SUCCESSFUL Staging Gate run (which
#                                             includes the GCP staging deploy and
#                                             smoke) exists for a staging commit
#                                             whose TREE is identical to this main
#                                             commit. Identical trees are what let
#                                             step 5 promote staging's images
#                                             byte-for-byte: prod runs exactly what
#                                             staging validated. Route: staging
#                                             first, then main.
#   5. Deploy to Production                 → calls gcp-prod.yml (digest promotion
#                                             of that staging commit's images, then
#                                             Cloud Run, Hosting, Scheduler, smoke).
#                                             The `gcp-prod` GitHub Environment has
#                                             REQUIRED REVIEWERS, so the run PAUSES
#                                             for a human approval before any prod
#                                             step executes. That approval replaces
#                                             the old approval-issue mechanism.
#
# Not here, deliberately: the production database. Cloud SQL changes are an
# operator action (cutover-db.sh), never CI. A bad deploy is rolled back by
# re-running the promotion for the previous good staging commit (see
# docs/plans/gcp-docker-migration/11-PROD-DEPLOY-RUNBOOK.md).
#
# Concurrency group `prod-deploy` with cancel-in-progress: false, so an
# in-flight prod deploy is never killed mid-deploy. The second push queues.

name: Phase-Gate Production Deploy

on:
  push:
    branches: [main]
    # Docs/help/markdown-only pushes skip the entire gate (including
    # the manual-approval pause and the deploy). The pre-push hook
    # already filtered docs-only changes before the push reached GH;
    # this is the second line of defense in case a commit was authored
    # on a different machine. 2026-08-12: CI-local-first, see
    # docs/CI-LOCAL-FIRST.md.
    paths-ignore:
      - 'docs/**'
      - 'public/help/**'
      - '.claude/**'
      - '*.md'
      - 'CHANGELOG.md'
  workflow_dispatch:
    inputs:
      bypass_staging_check:
        description: "Hotfix only: skip the staging proof and BUILD fresh prod images instead of promoting staging's (still needs the gcp-prod approval)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: read
  actions: read # staging-released reads the Staging Gate run history

concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  # ───────────────────────────────────────────────────────────────────
  # 1. FULL TEST SUITES
  # ───────────────────────────────────────────────────────────────────
  test-suites:
    name: "Production Gate: Test Suites"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".node-version"
          cache: "npm"
      # 2026-08-12: CI-local-first — cache Playwright's browser binaries so
      # the e2e step doesn't re-download chromium (~200MB) on every run.
      # The cache key is keyed on the lockfile (so package.json changes
      # bust it correctly) and the OS (so Ubuntu/macOS don't share).
      # Saves ~90s on warm cache, ~3min on cold. See docs/CI-LOCAL-FIRST.md.
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - run: npm ci

      - name: Release-readiness audit (admin leaks, email split, screenshot refs)
        run: npm run readiness

      - name: Unit tests (functional + regression)
        run: npm run test:unit

      - name: Contract tests (netlify functions)
        run: npm run test:contract

      - name: Integration tests
        run: npm run test:integration

      - name: System tests
        run: npm run test:system

      - name: Production build
        run: npm run build

      - name: Install Playwright browsers
        # `--with-deps` re-runs apt on every run (idempotent on warm cache)
        # but the actual browser download hits the cache above. When the
        # cache is warm, Playwright sees the browser is already extracted
        # and skips the download; the apt step still runs to make sure
        # the system libs (libnss, libxkbcommon, etc.) are present. The
        # `--with-deps` flag does the apt step itself, so this single
        # command is correct for both warm and cold cache.
        run: npx playwright install --with-deps chromium

      - name: End-to-end smoke tests (Playwright)
        run: npm run test:e2e:smoke

      - name: Security suite
        run: npm run test:security

  # ───────────────────────────────────────────────────────────────────
  # 2. VULNERABILITIES — bypass only via allowlist w/ TODO + expiry
  # ───────────────────────────────────────────────────────────────────
  vulnerabilities:
    name: "Production Gate: Vulnerabilities"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".node-version"
          cache: "npm"
      - name: Audit dependencies (high/critical block)
        run: node scripts/check-vulnerabilities.mjs

  # ───────────────────────────────────────────────────────────────────
  # 3. OPEN ISSUES / DEFECTS — bypass only via gate-bypass label + TODO
  # ───────────────────────────────────────────────────────────────────
  open-defects:
    name: "Production Gate: Open Issues/Defects"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".node-version"
      - name: Check open defects
        run: node scripts/check-open-defects.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────────
  # 4. STAGING RELEASED & TESTED — exact-content proof, not "similar history".
  #
  # Earlier versions of this check went wrong in both directions: requiring
  # identical SHAs (a merge commit can never satisfy that) and then requiring
  # ancestry (broke whenever staging moved ahead of a queued main run). Neither
  # answers the question that matters for a PROMOTION: "is what I am about to
  # ship byte-for-byte what staging validated?" Git answers that exactly:
  # equal TREE hashes. A merge commit and its second parent have different SHAs
  # and the same tree.
  #
  # A main-only change (a commit that never went through staging) makes the
  # trees differ and this job fails with the reason — merge it to staging first.
  # ─────────────────────────────────────────────────────────────────
  staging-released:
    name: "Staging Released & Tested"
    needs: [test-suites, vulnerabilities, open-defects]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.proof.outputs.tag }}
      promote: ${{ steps.proof.outputs.promote }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tree hashes of other commits need the history
      - name: Find a successful Staging Gate run for this exact content
        id: proof
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BYPASS: ${{ inputs.bypass_staging_check == true }}
        run: |
          set -euo pipefail
          if [ "$BYPASS" = "true" ]; then
            echo "::warning::bypass_staging_check — staging proof SKIPPED; prod images will be BUILT, not promoted"
            { echo "tag="; echo "promote=false"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MAIN_TREE=$(git rev-parse "${GITHUB_SHA}^{tree}")
          echo "main ${GITHUB_SHA:0:8} has tree ${MAIN_TREE:0:12}"
          # Newest first. Status "success" is the WHOLE run: all three gates AND
          # the GCP deploy + smoke job, so a red deploy can never qualify.
          RUNS=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "Staging Gate" \
                   --branch staging --event push --status success --limit 100 \
                   --json headSha --jq '.[].headSha')
          for SHA in $RUNS; do
            git cat-file -e "${SHA}^{commit}" 2>/dev/null || continue
            if [ "$(git rev-parse "${SHA}^{tree}")" = "$MAIN_TREE" ]; then
              echo "✓ staging commit ${SHA:0:8} passed the Staging Gate (deploy + smoke) with identical content"
              { echo "tag=$SHA"; echo "promote=true"; } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::No successful Staging Gate run has the same content as this main commit."
          echo "Route is staging first: merge this change to staging, wait for its Staging Gate"
          echo "(which deploys + smokes GCP staging) to go green, then merge staging to main."
          echo "Hotfix only: re-run this workflow manually with bypass_staging_check."
          exit 1

  # ─────────────────────────────────────────────────────────────────
  # 5. PRODUCTION DEPLOY — gcp-prod.yml, behind the gcp-prod environment's
  #    required reviewers (the approval pause happens inside that job).
  # ─────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    needs: [test-suites, vulnerabilities, open-defects, staging-released]
    uses: ./.github/workflows/gcp-prod.yml
    with:
      confirm_env: prod
      promote_from_staging: ${{ needs.staging-released.outputs.promote == 'true' }}
      staging_img_tag: ${{ needs.staging-released.outputs.tag }}
    secrets: inherit
