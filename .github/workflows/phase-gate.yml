# .github/workflows/phase-gate.yml
#
# Phase-Gate Production Deploy
# ─────────────────────────────
# Runs on every push to main. Enforces the production release policy:
#
#   1. Production Gate: Test Suites         → functional, regression, security,
#                                             integration and e2e suites green
#   2. Production Gate: Vulnerabilities     → no high/critical advisories unless
#                                             bypassed with a TODO + expiry
#   3. Production Gate: Open Issues/Defects → no open defects unless labeled
#                                             gate-bypass with a TODO
#   4. Staging Released & Tested            → the staging deploy is live, healthy,
#                                             and its commit is CONTAINED in this
#                                             main commit (staging was released,
#                                             deployed and tested first)
#   5. Await Manual Approval                → ⏸ the run PAUSES here. An approval
#                                             issue is opened and the deploy waits
#                                             until an authorized approver comments
#                                             `approved`. This works on a PRIVATE
#                                             repo on the GitHub FREE plan (it uses
#                                             Issues, not the Pro-only Environment
#                                             "required reviewers" feature, which
#                                             returns HTTP 422 on Free).
#   6. Deploy to Production                 → Netlify deploy, only after approval.
#   7. Smoke Test — Production              → verify the deploy; auto-rollback
#                                             to the last good deploy on failure
#
# ⚠️  FREE-PLAN ENFORCEMENT NOTE
# Branch protection + Environment required-reviewers are Pro/public-only. To
# make this gate actually binding on a Free private repo you MUST ALSO turn OFF
# Netlify "Auto publishing" for production (Netlify → Site → Build & deploy →
# Continuous deployment → Production branch → Stop auto publishing). Otherwise
# Netlify auto-deploys every push to `main` and bypasses this entire workflow.
# See docs/PHASE-GATE.md §"Free plan alternative".
#
# "Stop auto publishing" LOCKS the published production deploy, and a lock
# blocks every publish path — including this workflow's own `netlify deploy
# --prod`, which fails with:
#   Error: Deployments are "locked" for production context of this project
# That is not a misconfiguration to undo; it is the protection working.
#
# RELEASING PRODUCTION THEREFORE TAKES TWO HUMAN ACTS, on purpose:
#   (a) unlock production in the Netlify UI, and
#   (b) comment `approved` on the approval issue.
# The workflow will NOT unlock for you. `deploy-production` only verifies the
# unlock and fails fast with instructions if it is missing, so an approval alone
# can never change what datiq.app serves. `relock-production` (job 8, always())
# re-locks once smoke + any rollback are done, so each release needs a fresh
# unlock. Leave production locked between releases — that is the steady state.
#
# Concurrency group `prod-deploy` with cancel-in-progress: false, so an
# in-flight prod deploy is never killed mid-deploy. The second push queues.

name: Phase-Gate Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bypass_staging_check:
        description: "Skip staging released/tested check (hotfixes only — leave a TODO in the release notes)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write # the manual-approval gate opens/updates an approval issue

concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  # ───────────────────────────────────────────────────────────────────
  # 1. FULL TEST SUITES
  # ───────────────────────────────────────────────────────────────────
  test-suites:
    name: "Production Gate: Test Suites"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci

      - name: Release-readiness audit (admin leaks, email split, screenshot refs)
        run: npm run readiness

      - name: Unit tests (functional + regression)
        run: npm run test:unit

      - name: Contract tests (netlify functions)
        run: npm run test:contract

      - name: Integration tests
        run: npm run test:integration

      - name: System tests
        run: npm run test:system

      - name: Production build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end smoke tests (Playwright)
        run: npm run test:e2e:smoke

      - name: Security suite
        run: npm run test:security

  # ───────────────────────────────────────────────────────────────────
  # 2. VULNERABILITIES — bypass only via allowlist w/ TODO + expiry
  # ───────────────────────────────────────────────────────────────────
  vulnerabilities:
    name: "Production Gate: Vulnerabilities"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
      - name: Audit dependencies (high/critical block)
        run: node scripts/check-vulnerabilities.mjs

  # ───────────────────────────────────────────────────────────────────
  # 3. OPEN ISSUES / DEFECTS — bypass only via gate-bypass label + TODO
  # ───────────────────────────────────────────────────────────────────
  open-defects:
    name: "Production Gate: Open Issues/Defects"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Check open defects
        run: node scripts/check-open-defects.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────────
  # 4. STAGING RELEASED & TESTED — a ready staging deploy must be healthy
  #    AND share history with this main commit in either direction, i.e.
  #    this commit's content was deployed + tested on staging first.
  #    (Two earlier versions were too strict: requiring the SHAs to be
  #    identical, which merge commits can never satisfy; then requiring
  #    staging to be an ancestor of main, which broke whenever staging
  #    advanced ahead of a queued main run.)
  # ─────────────────────────────────────────────────────────────────
  staging-released:
    name: "Staging Released & Tested"
    needs: [test-suites, vulnerabilities, open-defects]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history for the ancestor check

      - name: Verify staging deploy is live and contained in main
        run: |
          set -e
          echo "Checking ready staging deploys against $GITHUB_SHA..."
          RESP=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.NETLIFY_AUTH_TOKEN }}" \
            "https://api.netlify.com/api/v1/sites/${{ secrets.NETLIFY_SITE_ID }}/deploys?per_page=20&context=branch-deploy")
          STAGING_SHAS=$(echo "$RESP" \
            | jq -r '[.[] | select(.branch == "staging" and .state == "ready") | .commit_ref // empty] | unique | .[]')
          if [ -z "$STAGING_SHAS" ]; then
            echo "✗ no ready staging deploy found on Netlify"
            exit 1
          fi
          echo "  ready staging deploys: $(echo "$STAGING_SHAS" | tr '\n' ' ')"

          # The policy is "everything in this main commit was released to staging
          # and tested there first". That holds in EITHER direction:
          #   staging ⊆ main  → staging shipped first, main merged it (normal case)
          #   main ⊆ staging  → staging has since moved on but still contains this
          #                     commit, so it was deployed + tested on staging.
          # Requiring only the first direction made any later staging push
          # retroactively fail an older, still-queued main run (run #22: staging
          # was at 14dd570 while this run was gating its own ancestor bded77d).
          # We also scan every ready staging deploy, not just the newest one.
          MATCH=""
          for SHA in $STAGING_SHAS; do
            git cat-file -e "$SHA^{commit}" 2>/dev/null || continue
            if git merge-base --is-ancestor "$SHA" "$GITHUB_SHA"; then
              MATCH="$SHA"; REL="staging commit is contained in main — staging was released first"
              break
            fi
            if git merge-base --is-ancestor "$GITHUB_SHA" "$SHA"; then
              MATCH="$SHA"; REL="main commit is contained in a newer staging deploy — it was released and tested on staging"
              break
            fi
          done

          if [ -n "$MATCH" ]; then
            echo "  ✓ matched staging deploy $MATCH: $REL"
          else
            echo "✗ none of the ready staging deploys share history with $GITHUB_SHA."
            echo "  Release to staging (and let it pass the Staging Gate) before releasing main."
            exit 1
          fi

      - name: Smoke test staging
        # staging.datiq.app is not provisioned (no cert covers it — see the note
        # in staging-gate.yml). Default to the branch-deploy host; override with
        # the STAGING_URL repo variable once the vanity domain is live.
        run: node scripts/smoke-prod.mjs "${{ vars.STAGING_URL || 'https://staging--datiqapp.netlify.app' }}"
        env:
          # Node 18+ (undici) resolves IPv6 first. GitHub runners frequently have
          # no working IPv6 route, so `fetch` fails with an opaque
          # "fetch failed (ENETUNREACH)" where curl on the same box succeeds.
          # Forcing IPv4 removes that whole class of phantom gate failure.
          NODE_OPTIONS: --dns-result-order=ipv4first
          SMOKE_ADMIN_PIN: ${{ secrets.STAGING_ADMIN_PIN }}

  # ─────────────────────────────────────────────────────────────────
  # 5. MANUAL APPROVAL — free-plan replacement for the Pro-only
  #    Environment "required reviewers" gate. Opens an approval issue and
  #    BLOCKS until an authorized approver comments `approved` (or `denied`
  #    to cancel). Works on a private repo on the GitHub Free plan.
  #
  #    The `production-release` environment is intentionally KEPT on the
  #    deploy job below (for the deployment URL + branch-policy restriction
  #    to `main`, both of which DO work on Free). If you later upgrade to
  #    Pro / go public and add required reviewers to that environment, you
  #    get a belt-and-suspenders double gate at no extra cost — delete this
  #    job then if you want a single approval prompt.
  # ─────────────────────────────────────────────────────────────────
  approve:
    name: Await Manual Approval
    needs: [test-suites, vulnerabilities, open-defects, staging-released]
    if: |
      always() &&
      needs.test-suites.result == 'success' &&
      needs.vulnerabilities.result == 'success' &&
      needs.open-defects.result == 'success' &&
      (needs.staging-released.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs.bypass_staging_check == true))
    runs-on: ubuntu-latest
    # Generous timeout — this is a human gate. Adjust to your review SLA.
    timeout-minutes: 1440
    steps:
      - name: Wait for an approver to comment "approved"
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ secrets.GITHUB_TOKEN }}
          # Comma-separated GitHub usernames allowed to approve/deny.
          approvers: vikashkaruna
          minimum-approvals: 1
          issue-title: "🚦 Approve production release of ${{ github.sha }}"
          issue-body: >
            All production gates are green (tests, vulnerabilities, open
            defects, staging released & tested).


            ⚠️ **TWO STEPS ARE REQUIRED — approving alone will not ship.**


            **1. Unlock production on Netlify.** Netlify → Deploys → the
            published production deploy → *Unlock deploys* (or "Resume auto
            publishing"). Production is kept locked between releases so no push
            to `main` can publish itself, and the deploy job deliberately does
            NOT lift that lock for you — an unlock is a hands-on confirmation
            that a human intends to change what datiq.app serves right now.


            **2. Then comment `approved`** to ship ${{ github.sha }} to
            https://datiq.app, or **denied** to cancel.


            If you approve while production is still locked, `Deploy to
            Production` fails immediately with instructions and nothing is
            published — unlock and re-run the job. After a successful deploy
            (or an auto-rollback) the `Re-lock Production` job locks production
            again, so the next release needs a fresh manual unlock.
          # Auto-close the approval issue when the workflow finishes.
          exclude-workflow-initiator-as-approver: false

  # ─────────────────────────────────────────────────────────────────
  # 6. PRODUCTION DEPLOY — runs only after the manual approval passes.
  # ─────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    needs: approve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production-release
      url: https://datiq.app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci

      # Build with the PRODUCTION env vars (read from the `production-release`
      # GitHub environment secrets, falling back to repo secrets). The build is
      # fully reproducible from CI without relying on Netlify env state.
      - name: Build
        run: npm run build -- --mode production
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_RAZORPAY_KEY_ID: ${{ secrets.VITE_RAZORPAY_KEY_ID }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_AI_MODEL: claude-3-5-haiku-20241022
          VITE_PAYMENT_PROVIDER: auto
          VITE_WEBHOOK_URL: ${{ secrets.VITE_WEBHOOK_URL }}
          VITE_LINK_CHANGELOG: https://datiq.app/changelog
          VITE_LINK_ABOUT: https://datiq.app/about
          VITE_LINK_BLOG: https://datiq.app/blog
          VITE_FIRECRAWL_API_KEY: ""

      # Production deploys are kept LOCKED between releases. That is what stops
      # Netlify auto-publishing every push to `main` and bypassing this gate.
      # A lock blocks ALL publishing, including this job's own
      # `netlify deploy --prod`, which fails with:
      #   Error: Deployments are "locked" for production context of this project
      #
      # By deliberate policy the workflow does NOT unlock for you. Lifting the
      # lock is a hands-on confirmation, in the Netlify UI, that a human intends
      # to change what datiq.app serves right now — a second control that does
      # not live in this repo and cannot be satisfied by merging code. So this
      # step only VERIFIES the unlock and fails fast with instructions if it is
      # missing, rather than papering over it.
      #
      # `relock-production` (job 8) locks production again at the end of the
      # run, so every release needs a fresh manual unlock.
      #
      # Do NOT "fix" a lock failure by switching to `--prod-if-unlocked`, which
      # the CLI suggests in its own error message: while locked that silently
      # produces a DRAFT deploy, the smoke job then tests the still-old
      # production and passes, and the run reports a successful release that
      # never shipped.
      - name: Require manual unlock of production
        run: |
          set -euo pipefail
          SITE_JSON=$(curl -sf -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID")
          PUBLISHED=$(echo "$SITE_JSON" | jq -r '.published_deploy.id // empty')
          LOCKED=$(echo "$SITE_JSON"    | jq -r '.published_deploy.locked // false')

          if [ -z "$PUBLISHED" ]; then
            echo "no published production deploy yet (first release) — nothing to unlock"
            exit 0
          fi

          echo "published deploy : $PUBLISHED"
          echo "locked           : $LOCKED"

          if [ "$LOCKED" = "true" ]; then
            echo "::error title=Production is locked::Unlock production on Netlify, then re-run this job."
            cat <<'MSG'

          ✗ Production deploys are LOCKED, so this deploy cannot publish.

            This gate requires the unlock to be done by a human, on purpose:

              Netlify → Deploys → the published production deploy
                      → "Unlock deploys" / "Resume auto publishing"

            Then re-run this job (Actions → this run → Re-run failed jobs).
            Nothing has been published, and production is untouched.

            After the deploy and smoke test finish, "Re-lock Production"
            locks production again, so the next release needs a fresh unlock.
          MSG
            exit 1
          fi

          echo "  ✓ production is unlocked — proceeding to deploy"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Deploy to Netlify (production)
        run: |
          npx --yes netlify-cli deploy \
            --prod \
            --dir=dist \
            --auth=$NETLIFY_AUTH_TOKEN \
            --site=$NETLIFY_SITE_ID \
            --message="phase-gate: ${{ github.event.head_commit.message }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  # ─────────────────────────────────────────────────────────────────
  # 7. PRODUCTION SMOKE — auto-rollback on failure
  # ─────────────────────────────────────────────────────────────────
  smoke-production:
    name: Smoke Test — Production
    needs: deploy-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci

      - name: Wait for Netlify CDN to converge
        run: sleep 30

      - name: Run smoke test against production
        run: node scripts/smoke-prod.mjs https://datiq.app
        env:
          # Node 18+ (undici) resolves IPv6 first. GitHub runners frequently have
          # no working IPv6 route, so `fetch` fails with an opaque
          # "fetch failed (ENETUNREACH)" where curl on the same box succeeds.
          # Forcing IPv4 removes that whole class of phantom gate failure.
          NODE_OPTIONS: --dns-result-order=ipv4first
          SMOKE_ADMIN_PIN: ${{ secrets.PRODUCTION_ADMIN_PIN }}

      - name: Auto-rollback on smoke failure
        if: failure()
        run: |
          echo "✗ production smoke failed, rolling back to last good deploy"
          npx --yes netlify-cli rollback \
            --auth=$NETLIFY_AUTH_TOKEN \
            --site=$NETLIFY_SITE_ID
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Notify on smoke failure
        if: failure()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "🚨 DatIQ production smoke FAILED. Auto-rollback executed. Commit: ${{ github.sha }}\nActor: ${{ github.actor }}\nWorkflow: ${{ github.workflow }} #${{ github.run_number }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────
  # 8. RE-LOCK PRODUCTION — restores the "no auto-publish" protection that the
  #    operator lifted by hand in order to let this release publish, so the
  #    NEXT release needs a fresh manual unlock.
  #
  #    Runs LAST and `always()`, so it also covers the rollback path:
  #    `netlify rollback` publishes a previous deploy and is itself blocked
  #    by a lock, so the lock must stay off until smoke-production is done.
  #
  #    If this job is skipped (run cancelled mid-flight), production is left
  #    UNLOCKED and the next push to `main` would auto-publish, bypassing the
  #    gate. Re-lock by hand in that case: Netlify → Deploys → the published
  #    deploy → "Stop auto publishing".
  # ─────────────────────────────────────────────────────────────────
  relock-production:
    name: Re-lock Production
    needs: [deploy-production, smoke-production]
    if: always() && needs.deploy-production.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Lock the currently published deploy
        run: |
          set -euo pipefail
          PUBLISHED=$(curl -sf -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID" | jq -r '.published_deploy.id // empty')
          if [ -z "$PUBLISHED" ]; then
            echo "::error::could not resolve the published deploy — production may be left UNLOCKED"
            exit 1
          fi
          echo "locking published deploy $PUBLISHED"
          curl -sf -X POST -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/deploys/$PUBLISHED/lock" -o /dev/null
          LOCKED=$(curl -sf -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID" | jq -r '.published_deploy.locked')
          echo "  published_deploy.locked = $LOCKED"
          [ "$LOCKED" = "true" ] || { echo "::error::lock did not take effect"; exit 1; }
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
